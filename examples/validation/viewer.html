function renderViewport(x,w,kind){gl.viewport(x,0,w,canvas.height);const eye=[target[0]+distance*Math.cos(phi)*Math.cos(theta),target[1]+distance*Math.cos(phi)*Math.sin(theta),target[2]+distance*Math.sin(phi)];gl.uniformMatrix4fv(loc.uMatrix,false,multiply(perspective(w/canvas.height),lookAt(eye,target)));gl.uniform1f(loc.uSize,Math.min(devicePixelRatio,2)*(kind==='overlay'?1.6:2.1));gl.disable(gl.BLEND);gl.depthMask(true);
if(kind!=='cloud'){gl.bindTexture(gl.TEXTURE_2D,kind==='confidence'?qualityTex:colorTex);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);draw(boxes,gl.TRIANGLES,0,1);gl.disable(gl.POLYGON_OFFSET_FILL);if(edges.checked)draw(wires,gl.LINES,2,.7);}
if(kind==='cloud')draw(cloud,gl.POINTS,1,1);if(kind==='overlay'){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);draw(cloud,gl.POINTS,1,.3);gl.depthMask(true);}}
function render(){resize();if(dirty&&colorTex&&qualityTex){gl.clearColor(.935,.949,.967,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);const compare=mode.value==='compare';document.getElementById('rightTag').style.display=compare?'block':'none';document.getElementById('divider').style.display=compare?'block':'none';document.getElementById('legend').style.display=mode.value==='confidence'?'block':'none';document.getElementById('leftTag').textContent=compare?'SOURCE POINTS':({texture:'13 TEXTURED CUBOIDS',cloud:'SOURCE POINTS',overlay:'CUBOIDS + SOURCE POINTS',confidence:'PROJECTION CONFIDENCE'})[mode.value];if(compare){const half=Math.floor(canvas.width/2);renderViewport(0,half,'cloud');renderViewport(half,canvas.width-half,'texture');}else renderViewport(0,canvas.width,mode.value);dirty=false;window.viewerState={ready:true,mode:mode.value,cuboids:data.report.cuboids,vertices:Number(step.value)*36,glError:gl.getError()};}requestAnimationFrame(render)}
Promise.all([texture(data.texture),texture(data.confidence)]).then(t=>{[colorTex,qualityTex]=t;document.getElementById('status').textContent=`${data.report.faces} faces · texture ${data.report.atlas_size[0]}² · offline viewer`;dirty=true;window.viewerReady=true}).catch(()=>fail('Could not load embedded textures.'));
requestAnimationFrame(render);
</script></html>
