<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuboid approximation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#253345;font:14px system-ui,sans-serif;overflow:hidden}header{height:100px;padding:18px 26px;background:#fff;border-bottom:1px solid #d9e0e8;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:21px;letter-spacing:-.5px;margin:0 0 6px}p{margin:0;color:#657186;font-size:13px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px}select,button,a{font:inherit;border:1px solid #ced7e2;border-radius:7px;background:white;color:#253345;padding:9px 12px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#eff5f9}label{white-space:nowrap;font-size:13px}#stage{height:calc(100vh - 148px);position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.tag{position:absolute;top:18px;left:25px;pointer-events:none;font-size:12px;font-weight:650;letter-spacing:.5px;color:#55667b;background:#ffffffd9;padding:9px 13px;border-radius:6px}#rightTag{left:calc(50% + 25px)}#divider{position:absolute;left:50%;height:100%;width:1px;background:#ccd5e0;pointer-events:none}#legend{position:absolute;bottom:16px;left:24px;display:none;background:#fff;padding:12px;border-radius:7px;color:#526176}i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 6px 0 12px}footer{height:48px;background:#fff;border-top:1px solid #d9e0e8;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;color:#657186}#error{position:absolute;top:35%;left:15%;right:15%;color:#b02e3d;background:#fff;padding:25px;display:none} @media(max-width:1000px){header{height:142px;align-items:flex-start;gap:12px;flex-direction:column;padding:12px 18px}#stage{height:calc(100vh - 190px)}.controls{gap:6px}select,button,a{padding:6px 8px}footer{padding:0 16px}.export{display:none}}
</style>
<header><div><h1>Textured cuboid approximation</h1><p id="subtitle">__CUBOID_COUNT__ cuboids · source coordinates preserved</p></div><div class="controls">
<select id="mode" aria-label="Display"><option value="compare">Source / result</option><option value="texture">Textured cuboids</option><option value="cloud">Source points</option><option value="overlay">Overlay</option><option value="confidence">Projection confidence</option></select>
<label>Construction <input id="step" type="range" min="0" max="__CUBOID_COUNT__" value="0"><output id="stepValue">0</output></label><label><input id="edges" type="checkbox"> Cuboid edges</label><button id="reset">Reset</button><button id="front">Front</button><button id="back">Back</button><a class="export" href="cuboids_textured.glb" download>GLB ↓</a>
</div></header>
<div id="stage"><canvas id="canvas" tabindex="0" aria-label="Interactive 3D viewer"></canvas><div id="leftTag" class="tag">SOURCE POINTS</div><div id="rightTag" class="tag">__CUBOID_COUNT__ TEXTURED CUBOIDS</div><div id="divider"></div><div id="legend"><i style="background:#33bc93"></i>Supported projection <i style="background:#f0913e"></i>Uncertain / interpolated / unobserved</div><div id="error"></div></div>
<footer><span>Drag: rotate · wheel: zoom · right drag: pan · R: reset</span><span id="status">Loading texture…</span></footer>
<script>
'use strict';
const data=__PAYLOAD__;
const canvas=document.getElementById('canvas'), gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
function fail(message){document.getElementById('error').textContent=message;document.getElementById('error').style.display='block';throw Error(message)}
if(!gl)fail('This viewer requires WebGL 2.');
function floats(s){const b=atob(s), a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Float32Array(a.buffer)}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))fail(gl.getShaderInfoLog(s));return s}
const vs=`#version 300 es
in vec3 aPosition;in vec2 aUV;in vec3 aColor;uniform mat4 uMatrix;uniform float uSize;out vec2 vUV;out vec3 vColor;
void main(){vec3 p=vec3(aPosition.x,-aPosition.z,aPosition.y);gl_Position=uMatrix*vec4(p,1.);gl_PointSize=uSize;vUV=aUV;vColor=aColor;}`;
const fs=`#version 300 es
precision highp float;in vec2 vUV;in vec3 vColor;uniform sampler2D uTexture;uniform int uMode;uniform float uAlpha;out vec4 color;
vec3 encodeSRGB(vec3 c){return mix(12.92*c,1.055*pow(c,vec3(1./2.4))-.055,step(vec3(.0031308),c));}
void main(){if(uMode==1){vec2 p=gl_PointCoord-vec2(.5);if(dot(p,p)>.25)discard;color=vec4(vColor,uAlpha);}else if(uMode==2){color=vec4(.10,.14,.19,uAlpha);}else{color=vec4(encodeSRGB(texture(uTexture,vUV).rgb),uAlpha);}}`;
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))fail(gl.getProgramInfoLog(program));gl.useProgram(program);
const loc={};for(const n of ['uMatrix','uSize','uTexture','uMode','uAlpha'])loc[n]=gl.getUniformLocation(program,n);
function mesh(position,uv,color){const vao=gl.createVertexArray();gl.bindVertexArray(vao);for(const [name,array,n] of [['aPosition',position,3],['aUV',uv,2],['aColor',color,3]]){const l=gl.getAttribLocation(program,name);if(array){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,array,gl.STATIC_DRAW);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,0,0);}else gl.disableVertexAttribArray(l);}return{vao,count:position.length/3}}
const boxes=mesh(floats(data.vertices),floats(data.uv),null),cloud=mesh(floats(data.points),null,floats(data.colors)),wires=mesh(floats(data.wires),null,null);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
function texture(base64){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.SRGB8_ALPHA8,gl.RGBA,gl.UNSIGNED_BYTE,im);for(const p of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,p,gl.CLAMP_TO_EDGE);for(const p of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAX_LEVEL,2);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);const error=gl.getError();if(error!==gl.NO_ERROR){reject(new Error(`Texture upload failed (${error})`));return;}resolve(t)};im.onerror=reject;im.src='data:image/png;base64,'+base64})}
function sub(a,b){return a.map((v,i)=>v-b[i])}function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function unit(a){const l=Math.hypot(...a);return a.map(x=>x/l)}
function lookAt(eye,target){const z=unit(sub(eye,target)),x=unit(cross([0,0,1],z)),y=cross(z,x);return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]}
function perspective(aspect){const f=1/Math.tan(Math.PI/8),near=extent*.001,far=extent*100;return[f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]}
function multiply(a,b){const r=new Float32Array(16);for(let c=0;c<4;c++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)r[c*4+row]+=a[k*4+row]*b[c*4+k];return r}
const points=floats(data.points),min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(let i=0;i<points.length;i+=3){const p=[points[i],-points[i+2],points[i+1]];for(let j=0;j<3;j++){min[j]=Math.min(min[j],p[j]);max[j]=Math.max(max[j],p[j]);}}
const home=min.map((v,i)=>(v+max[i])/2),extent=Math.max(...sub(max,min)),radius=.5*Math.hypot(...sub(max,min));function fitDistance(){const split=document.getElementById("mode").value==="compare"?2:1;const aspect=canvas.clientWidth/split/canvas.clientHeight;const angle=Math.min(Math.PI/8,Math.atan(Math.tan(Math.PI/8)*aspect));return radius/Math.sin(angle)*1.10}let target=[...home],theta=-.5,phi=.14,distance=fitDistance(),dirty=true;
function reset(){target=[...home];theta=-.5;phi=.14;distance=fitDistance();dirty=true}
document.getElementById('reset').onclick=reset;document.getElementById('front').onclick=()=>{reset();theta=0;phi=0};document.getElementById('back').onclick=()=>{reset();theta=Math.PI;phi=0};
const step=document.getElementById('step');step.oninput=()=>{document.getElementById('stepValue').textContent=step.value;dirty=true};
const mode=document.getElementById('mode'),edges=document.getElementById('edges');mode.onchange=()=>{dirty=true};edges.onchange=()=>{dirty=true};
canvas.oncontextmenu=e=>e.preventDefault();let drag=null;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,button:e.button};canvas.focus()};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.button===2||e.shiftKey){const scale=distance/canvas.clientHeight*.85;target[0]+=Math.sin(theta)*dx*scale;target[1]-=Math.cos(theta)*dx*scale;target[2]+=dy*scale;}else{theta-=dx*.008;phi=Math.max(-1.45,Math.min(1.45,phi+dy*.008));}drag.x=e.clientX;drag.y=e.clientY;dirty=true};
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(.12*extent,Math.min(12*extent,distance*Math.exp(e.deltaY*.001)));dirty=true},{passive:false});window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')reset()});
function resize(){const ratio=Math.min(devicePixelRatio,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);if(w!==canvas.width||h!==canvas.height){canvas.width=w;canvas.height=h;dirty=true}}
let colorTex,qualityTex;
function boxVertexCount(){return data.box_vertex_ends[Number(step.value)]}
function draw(mesh,primitive,drawMode,alpha){gl.bindVertexArray(mesh.vao);gl.uniform1i(loc.uMode,drawMode);gl.uniform1f(loc.uAlpha,alpha);gl.drawArrays(primitive,0,mesh===boxes?boxVertexCount():mesh===wires?Number(step.value)*48:mesh.count)}
function renderViewport(x,w,kind){gl.viewport(x,0,w,canvas.height);const eye=[target[0]+distance*Math.cos(phi)*Math.cos(theta),target[1]+distance*Math.cos(phi)*Math.sin(theta),target[2]+distance*Math.sin(phi)];gl.uniformMatrix4fv(loc.uMatrix,false,multiply(perspective(w/canvas.height),lookAt(eye,target)));gl.uniform1f(loc.uSize,Math.min(devicePixelRatio,2)*(kind==='overlay'?1.6:2.1));gl.disable(gl.BLEND);gl.depthMask(true);
if(kind!=='cloud'){gl.bindTexture(gl.TEXTURE_2D,kind==='confidence'?qualityTex:colorTex);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);draw(boxes,gl.TRIANGLES,0,1);gl.disable(gl.POLYGON_OFFSET_FILL);if(edges.checked)draw(wires,gl.LINES,2,.7);}
if(kind==='cloud')draw(cloud,gl.POINTS,1,1);if(kind==='overlay'){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);draw(cloud,gl.POINTS,1,.3);gl.depthMask(true);}}
function render(){resize();if(dirty&&colorTex&&qualityTex){gl.clearColor(.935,.949,.967,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);const compare=mode.value==='compare';document.getElementById('rightTag').style.display=compare?'block':'none';document.getElementById('divider').style.display=compare?'block':'none';document.getElementById('legend').style.display=mode.value==='confidence'?'block':'none';document.getElementById('leftTag').textContent=compare?'SOURCE POINTS':({texture:'__CUBOID_COUNT__ TEXTURED CUBOIDS',cloud:'SOURCE POINTS',overlay:'CUBOIDS + SOURCE POINTS',confidence:'PROJECTION CONFIDENCE'})[mode.value];if(compare){const half=Math.floor(canvas.width/2);renderViewport(0,half,'cloud');renderViewport(half,canvas.width-half,'texture');}else renderViewport(0,canvas.width,mode.value);dirty=false;window.viewerState={ready:true,mode:mode.value,cuboids:data.report.cuboids,vertices:boxVertexCount(),glError:gl.getError()};}requestAnimationFrame(render)}
Promise.all([texture(data.texture),texture(data.confidence)]).then(t=>{[colorTex,qualityTex]=t;document.getElementById('status').textContent=`${data.report.faces} faces · texture ${data.report.atlas_size[0]}² · offline viewer`;dirty=true;window.viewerReady=true}).catch(()=>fail('Could not load embedded textures.'));
requestAnimationFrame(render);
</script></html>
